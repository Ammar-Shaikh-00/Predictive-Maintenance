[alembic]
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://pm_user:pm_pass@localhost:5434/pm_db
#sqlalchemy.url = postgresql+asyncpg://pm_user:pm_pass@pm-updated-db:5434/pm_db
# sqlalchemy.url = postgresql+asyncpg://pm_user:pm_pass@pm-prod-db:5432/pm_db ;for production
#sqlalchemy.url = postgresql+asyncpg://pm_user:pm_pass@100.119.197.81:5434/pm_db



[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

