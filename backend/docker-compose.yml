version: "3.9"

services:
  backend:
    build:
      context: .
    container_name: pm-updated-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CAPABILITY_CATALOG_PATH: /app/catalogs/capability_component_catalog.json
    volumes:
      - ../Docs/capability_component_catalog.json:/app/catalogs/capability_component_catalog.json:ro
    ports:
      - "8002:8002"
    command: >
      sh -c "python scripts/wait_for_db.py &&
             python scripts/fix_alembic_version.py 2>/dev/null || true &&
             alembic upgrade head 2>&1 | grep -v 'already exists' || true &&
             uvicorn app.main:app --host 0.0.0.0 --port 8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pm-network

networks:
  pm-network:
      external: true